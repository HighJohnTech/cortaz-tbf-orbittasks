name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm-cache:
    name: Warm npm cache
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

  checks:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    needs: warm-cache
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Build web
        run: npm run build --workspace=apps/web

      - name: Upload API build
        uses: actions/upload-artifact@v4
        with:
          name: build-api
          path: apps/api/dist
          if-no-files-found: error

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: build-web
          path: apps/web/dist
          if-no-files-found: error

  tests:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: warm-cache
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: API shard 1 of 2
            command: npm test --workspace=apps/api -- --shard=1/2

          - label: API shard 2 of 2
            command: npm test --workspace=apps/api -- --shard=2/2

          - label: Web tests
            command: npm test --workspace=apps/web

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: ${{ matrix.command }}

  deploy:
    name: Deploy (simulated)
    runs-on: ubuntu-latest
    needs: [checks, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download API build
        uses: actions/download-artifact@v4
        with:
          name: build-api
          path: apps/api/dist

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: build-web
          path: apps/web/dist

      - name: Deploy
        run: npm run deploy
